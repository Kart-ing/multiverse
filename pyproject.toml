[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiverse-engine"
version = "0.1.0"
description = "A speculative execution harness for AI agents — forking, isolation, atomic commit, and deterministic replay for tool calls."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["ai-agents", "speculative-execution", "sandbox", "replay", "tool-calls"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
