<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brew & Bloom</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap');

  body {
    font-family: 'Inter', sans-serif;
    color: #f5f0eb;
    background: #1a1814;
    overflow-x: hidden;
  }

  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2rem;
    position: relative;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(139, 90, 43, 0.15) 0%, transparent 70%),
      radial-gradient(ellipse 60% 50% at 80% 20%, rgba(210, 160, 100, 0.08) 0%, transparent 60%),
      #1a1814;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 80%, rgba(139, 90, 43, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 70% 30%, rgba(210, 160, 100, 0.04) 0%, transparent 50%);
  }

  .grain {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px;
    pointer-events: none;
  }

  .nav {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 2.5rem;
    z-index: 10;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: #d2a064;
    letter-spacing: 0.5px;
  }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    color: #b8b0a4;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: color 0.3s;
  }

  .nav-links a:hover { color: #d2a064; }

  .content {
    position: relative;
    z-index: 2;
    max-width: 720px;
  }

  .badge {
    display: inline-block;
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #d2a064;
    border: 1px solid rgba(210, 160, 100, 0.3);
    padding: 0.5rem 1.2rem;
    border-radius: 100px;
    margin-bottom: 2.5rem;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -1px;
    margin-bottom: 1.5rem;
  }

  h1 span {
    display: block;
    color: #d2a064;
    font-style: italic;
  }

  .subtitle {
    font-size: 1.1rem;
    color: #8a8070;
    line-height: 1.7;
    max-width: 500px;
    margin: 0 auto 3rem;
    font-weight: 300;
  }

  .cta-group {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 0.85rem 2rem;
    border-radius: 100px;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    display: inline-block;
  }

  .btn-primary {
    background: #d2a064;
    color: #1a1814;
    border: none;
  }

  .btn-primary:hover {
    background: #e0b878;
    transform: translateY(-1px);
  }

  .btn-outline {
    background: transparent;
    color: #d2a064;
    border: 1px solid rgba(210, 160, 100, 0.4);
  }

  .btn-outline:hover {
    border-color: #d2a064;
    background: rgba(210, 160, 100, 0.06);
  }

  .features {
    display: flex;
    gap: 3rem;
    margin-top: 5rem;
    position: relative;
    z-index: 2;
  }

  .feature {
    text-align: center;
  }

  .feature-number {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: #d2a064;
  }

  .feature-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #6b6050;
    margin-top: 0.3rem;
  }

  @media (max-width: 640px) {
    .nav { padding: 1rem 1.5rem; }
    .nav-links { display: none; }
    .features { gap: 2rem; margin-top: 3.5rem; }
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="grain"></div>
    <nav class="nav">
      <div class="logo">Brew & Bloom</div>
      <ul class="nav-links">
        <li><a href="#">Menu</a></li>
        <li><a href="#">Story</a></li>
        <li><a href="#">Locations</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <div class="content">
      <div class="badge">Est. 2026</div>
      <h1>Craft coffee,<span>poured with care.</span></h1>
      <p class="subtitle">
        Single-origin beans roasted in-house daily. Every cup is a ritual — from farm to your hands.
      </p>
      <div class="cta-group">
        <a href="#" class="btn btn-primary">Explore Menu</a>
        <a href="#" class="btn btn-outline">Find a Location</a>
      </div>
      <div class="features">
        <div class="feature">
          <div class="feature-number">12+</div>
          <div class="feature-label">Origins</div>
        </div>
        <div class="feature">
          <div class="feature-number">4.9</div>
          <div class="feature-label">Rating</div>
        </div>
        <div class="feature">
          <div class="feature-number">3</div>
          <div class="feature-label">Locations</div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
